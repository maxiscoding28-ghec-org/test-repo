# .github/workflows/self-hosted-runner-test.yml
name: Self Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Linux, ARM64]   # 👈 match the runner labels shown in UI                     # if you want debug vars from your "test" env
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner arch: $RUNNER_ARCH"

      - name: Simulate workload
        run: |
          echo "Starting workload on ARM64 runner..."
          sleep 20
          echo "Done ✅"
